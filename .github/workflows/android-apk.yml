name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["agent/cloudflare-mobile-rebuild"]
    paths:
      - "src/**"
      - "public/**"
      - "assets/**"
      - "worker/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "vite.android.config.ts"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript check
        run: npm run typecheck
      - name: Validate D1 migrations locally
        run: |
          cp wrangler.jsonc wrangler.ci.jsonc
          sed -i 's/REPLACE_WITH_D1_DATABASE_ID/00000000-0000-0000-0000-000000000000/' wrangler.ci.jsonc
          npx wrangler d1 migrations apply hal-takip-db --local --config wrangler.ci.jsonc
          rm -f wrangler.ci.jsonc
      - name: Build Android web assets
        env:
          VITE_API_BASE_URL: ${{ vars.HAL_API_BASE_URL }}
        run: npm run build:android-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate Android project
        run: npx cap add android && npx cap sync android
      - name: Generate HAL Android icon and splash
        run: npm run android:assets
      - name: Build installable debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HAL-Takip-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
